apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: filedrop
build:
  cluster:
    namespace: codemowers-agent-system
    dockerConfig:
      secretName: zot-registry-cluster-push-kaniko
  artifacts:
    - image: filedrop
      context: .
      kaniko:
        dockerfile: Dockerfile
manifests:
  rawYaml:
    - k8s/*.yaml
deploy:
  kubectl: {}
