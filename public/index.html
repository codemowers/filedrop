<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FileDrop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#222;min-height:100vh}
header{background:#1a1a2e;color:#eee;padding:1rem 1.5rem;display:flex;align-items:center;gap:1rem}
header h1{font-size:1.3rem;font-weight:700;flex:1}
.badge{background:#e94560;color:#fff;border-radius:4px;padding:2px 8px;font-size:0.75rem;font-weight:600}
.btn{cursor:pointer;border:none;border-radius:6px;padding:8px 16px;font-size:0.9rem;font-weight:600;transition:opacity 0.15s}
.btn:hover{opacity:0.85}
.btn-primary{background:#e94560;color:#fff}
.btn-secondary{background:#333;color:#fff}
.btn-small{padding:4px 10px;font-size:0.8rem;border-radius:4px;cursor:pointer;border:none;font-weight:600}
.btn-danger{background:#c0392b;color:#fff}
.btn-ghost{background:transparent;border:1px solid #ccc;color:#555}
main{max-width:960px;margin:0 auto;padding:1.5rem}
.mode-banner{background:#fff8e1;border:1px solid #ffe082;border-radius:6px;padding:0.75rem 1rem;margin-bottom:1.5rem;font-size:0.9rem}
.tabs{display:flex;gap:0;margin-bottom:1.5rem;border-bottom:2px solid #ddd}
.tab{padding:10px 20px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:600;color:#666;transition:color 0.15s}
.tab.active{border-bottom-color:#e94560;color:#e94560}
section{display:none}
section.active{display:block}
.upload-area{border:2px dashed #bbb;border-radius:10px;padding:2.5rem;text-align:center;background:#fff;cursor:pointer;transition:border-color 0.2s,background 0.2s;position:relative}
.upload-area.drag{border-color:#e94560;background:#fff0f3}
.upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-area p{color:#888;margin-top:0.5rem;font-size:0.9rem}
.upload-opts{background:#fff;border-radius:8px;padding:1rem;margin-top:1rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:center}
.upload-opts label{font-size:0.9rem;font-weight:600;display:flex;align-items:center;gap:6px}
.upload-opts input[type=datetime-local]{font-size:0.85rem;border:1px solid #ddd;border-radius:4px;padding:4px 8px}
.progress-list{margin-top:1rem}
.progress-item{background:#fff;border-radius:6px;padding:0.75rem;margin-bottom:0.5rem;display:flex;align-items:center;gap:0.75rem}
.progress-bar-wrap{flex:1;height:6px;background:#eee;border-radius:3px;overflow:hidden}
.progress-bar{height:100%;background:#e94560;width:0;transition:width 0.2s}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-top:1rem}
.file-card{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);cursor:pointer;transition:box-shadow 0.2s}
.file-card:hover{box-shadow:0 3px 10px rgba(0,0,0,0.14)}
.file-thumb{height:130px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:2.5rem;overflow:hidden}
.file-thumb img{width:100%;height:100%;object-fit:cover}
.file-info{padding:0.6rem 0.75rem}
.file-name{font-size:0.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{font-size:0.75rem;color:#888;margin-top:2px}
.file-list{list-style:none}
.file-row{background:#fff;border-radius:6px;padding:0.75rem 1rem;margin-bottom:0.5rem;display:flex;align-items:center;gap:0.75rem;cursor:pointer}
.file-row:hover{background:#f9f9f9}
.file-row .name{flex:1;font-weight:600;font-size:0.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row .meta{font-size:0.8rem;color:#888;min-width:80px;text-align:right}
.vis-badge{border-radius:4px;padding:2px 7px;font-size:0.72rem;font-weight:700}
.vis-public{background:#d4edda;color:#155724}
.vis-private{background:#f3e2e2;color:#721c24}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal{background:#fff;border-radius:10px;max-width:680px;width:100%;max-height:90vh;overflow-y:auto;padding:1.5rem;position:relative}
.modal h2{margin-bottom:1rem;font-size:1.1rem}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.4rem;cursor:pointer;color:#888}
.preview{max-width:100%;border-radius:6px;margin-bottom:1rem}
.preview img,.preview video,.preview audio{max-width:100%;border-radius:6px}
.preview iframe{width:100%;height:400px;border:none;border-radius:6px}
.preview pre{background:#f5f5f5;border-radius:6px;padding:1rem;max-height:300px;overflow:auto;font-size:0.8rem;white-space:pre-wrap;word-break:break-all}
.meta-table{width:100%;font-size:0.85rem;border-collapse:collapse;margin-bottom:1rem}
.meta-table td{padding:4px 0;vertical-align:top}
.meta-table td:first-child{color:#888;width:120px}
.share-box{background:#f9f9f9;border-radius:6px;padding:0.75rem;margin-top:1rem;font-size:0.85rem;word-break:break-all}
.actions{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:1rem}
.mgmt-warning{background:#fff3cd;border:1px solid #ffc107;border-radius:6px;padding:0.75rem;margin-top:1rem;font-size:0.85rem;word-break:break-all}
.load-more{text-align:center;margin-top:1rem}
.empty{text-align:center;color:#aaa;padding:3rem 1rem;font-size:0.95rem}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#333;color:#fff;border-radius:6px;padding:0.6rem 1.2rem;font-size:0.9rem;z-index:200;animation:fadein 0.2s}
@keyframes fadein{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.spinner{display:inline-block;border:3px solid #eee;border-top-color:#e94560;border-radius:50%;width:20px;height:20px;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>📂 FileDrop</h1>
  <span id="modeBadge" class="badge"></span>
  <div id="authArea"></div>
</header>

<div id="modeBanner" class="mode-banner" style="display:none"></div>

<main>
  <div class="tabs">
    <div class="tab active" data-tab="gallery">Gallery</div>
    <div class="tab" data-tab="upload" id="uploadTab">Upload</div>
    <div class="tab" data-tab="myfiles" id="myfilesTab" style="display:none">My Files</div>
  </div>

  <section id="tab-gallery" class="active">
    <div class="file-grid" id="galleryGrid"></div>
    <div class="load-more" id="galleryMore" style="display:none">
      <button class="btn btn-ghost" onclick="loadMoreGallery()">Load more</button>
    </div>
    <div class="empty" id="galleryEmpty" style="display:none">No public files yet.</div>
  </section>

  <section id="tab-upload">
    <div id="uploadGate" style="display:none">
      <p style="color:#888;text-align:center;padding:2rem">Sign in to upload files.</p>
      <div style="text-align:center"><button class="btn btn-primary" onclick="startLogin()">Sign In</button></div>
    </div>
    <div id="uploadForm">
      <div class="upload-area" id="dropZone">
        <input type="file" id="fileInput" multiple>
        <div style="font-size:2.5rem">☁️</div>
        <strong>Drop files here or click to browse</strong>
        <p id="maxSizeHint"></p>
      </div>
      <div class="upload-opts">
        <label>
          Visibility:
          <select id="visSelect">
            <option value="private">🔒 Private</option>
            <option value="public">🌐 Public</option>
          </select>
        </label>
        <label>
          Expires:
          <input type="datetime-local" id="expiresInput" min="">
        </label>
        <button class="btn btn-primary" onclick="doUpload()">Upload</button>
      </div>
      <div class="progress-list" id="progressList"></div>
    </div>
  </section>

  <section id="tab-myfiles">
    <div id="myfilesList"></div>
  </section>
</main>

<div id="fileModal" class="modal-backdrop" style="display:none">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <h2 id="modalTitle"></h2>
    <div id="previewArea" class="preview"></div>
    <table class="meta-table" id="metaTable"></table>
    <div id="shareBox" class="share-box" style="display:none"></div>
    <div class="actions" id="modalActions"></div>
    <div id="mgmtBox" class="mgmt-warning" style="display:none"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
