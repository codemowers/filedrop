apiVersion: codemowers.cloud/v1
kind: OIDCClient
metadata:
  name: filedrop
  namespace: codemowers-agent-system
spec:
  displayName: FileDrop
  grantTypes:
    - authorization_code
  responseTypes:
    - code
  pkce: true
  tokenEndpointAuthMethod: "none"
  availableScopes:
    - openid
    - profile
    - email
  uri: "https://filedrop.codemowers-agent-system.ee-lte-1.codemowers.io"
  redirectUris:
    - "https://filedrop.codemowers-agent-system.ee-lte-1.codemowers.io/auth/callback"
  allowedCORSOrigins:
    - "https://filedrop.codemowers-agent-system.ee-lte-1.codemowers.io"
