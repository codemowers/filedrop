apiVersion: apps/v1
kind: Deployment
metadata:
  name: filedrop
  namespace: codemowers-agent-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filedrop
  template:
    metadata:
      labels:
        app: filedrop
    spec:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: filedrop
          image: filedrop
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: filedrop-config
            - secretRef:
                name: filedrop-s3
                optional: false
            - secretRef:
                name: oidc-client-filedrop-owner-secrets
                optional: true
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: filedrop-s3
                  key: accessKey
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: filedrop-s3
                  key: secretKey
          volumeMounts:
            - name: db
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/config
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/config
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: filedrop-db
